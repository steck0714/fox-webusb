[build-system]
# 🆕 v0.0.0.3: setuptools>=77 (以前は>=68)。姉妹プロジェクトpyside6-webusbが
# 0.0.5a0で見つけたのと同じ理由: 下記 `license = "MIT"` のSPDX式1行形式は
# setuptools>=77が要求する。実際に `python -m build` を走らせて
# `project.license` テーブル形式への非推奨警告(2027-02-18に削除予定)を
# 確認した上での対応(検査だけでなく実際にビルドして見つけた)。
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fox-webusb-host"
version = "0.0.0.3"
description = "Firefox native-messaging host for fox-webusb: a WebUSB (navigator.usb) polyfill for Firefox, ported from pyside6-webusb. Talks to real USB hardware via pyusb/libusb on behalf of the fox-webusb WebExtension."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = [
    "pyusb>=1.2",
]

# 🦊 移植元 (pyside6-webusb) の pyproject.toml との最大の違いは、
# PySide6-Essentials への依存が無くなったこと。QtWebEngineへの埋め込みが
# 前提だった原作と違い、fox-webusbのネイティブホストはFirefox自身から
# ネイティブメッセージングで起動される独立プロセスであり、GUIツールキットは
# (チューザーダイアログ用に)標準ライブラリのTkinterだけで足りる。

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
# 🛡️ v0.0.0a1: ローカルアテステーション機能(attestation.py)用。基本機能
# (デバイスへの接続・転送等)には一切不要な、独立したオプトイン機能なので、
# HAVE_RUST_ACCELの native/fox_webusb_accel/ と同じ「無ければ機能を
# 無効化するだけ」という設計方針にし、必須依存には加えていない。
attestation = [
    "cryptography>=41",
]

# native/fox_webusb_accel/ (Rustアクセラレーション) は意図的にここに列挙して
# いない。原作のnative/pyside6_webusb_accel/と同じ位置づけで、完全にオプトイン
# の別クレートであり、pipの依存関係としてではなく `maturin develop --release`
# (開発時)または `maturin build --release` → `pip install <wheel>`
# (配布時)で個別にビルド・インストールするもの。ビルドしなくても
# fox-webusb-hostは標準ライブラリのbase64へ自動的にフォールバックして
# 完全に動作する。詳細はnative/fox_webusb_accel/README、および
# README.md「Rustアクセラレーション(任意)」を参照。

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
fox-webusb-host = "fox_webusb_host.__main__:main"
# 🆕 v0.0.0.3: 姉妹プロジェクトpyside6-webusbの`pyside6-webusb-doctor`
# (0.0.5a0で追加)と同じ発想の環境診断コマンド。`fox-webusb-host`本体
# (Firefoxから直接起動される、標準入出力を使う常駐プロセス)とは完全に別の
# エントリポイントにしている——診断ツールが本体の起動契約に一切影響しない
# ようにするため。
fox-webusb-host-doctor = "fox_webusb_host.diagnostics:main"
