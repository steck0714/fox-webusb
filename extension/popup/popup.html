<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>fox-webusb</title>
<style>
  :root { color-scheme: light dark; }
  body {
    width: 280px;
    margin: 0;
    font: 13px/1.5 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    color: #222;
    background: #fff;
  }
  header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 14px 8px;
  }
  header img { width: 24px; height: 24px; }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; }
  .status {
    margin: 0 14px 12px;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 12.5px;
  }
  .status.ok { background: #e6f4ea; color: #1e4620; }
  .status.bad { background: #fde7e7; color: #611a15; }
  .status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .status.ok .dot { background: #2e7d32; }
  .status.bad .dot { background: #c62828; }
  .row { display: flex; justify-content: space-between; padding: 2px 0; }
  .row .k { color: #666; }
  .detail { margin: 0 14px 12px; font-size: 12px; color: #444; }
  footer { padding: 10px 14px 14px; border-top: 1px solid #eee; }
  button {
    width: 100%;
    padding: 8px 10px;
    font-size: 12.5px;
    border-radius: 6px;
    border: 1px solid #d8792d;
    background: #e07a2a;
    color: #fff;
    cursor: pointer;
  }
  button:hover { background: #c9691f; }
  button.secondary {
    background: transparent;
    color: #333;
    border-color: #ccc;
    margin-top: 6px;
  }
  button.secondary:hover { background: #f5f5f5; }
  a { color: #c9691f; }
  @media (prefers-color-scheme: dark) {
    body { background: #1e1e1e; color: #eee; }
    .detail { color: #bbb; }
    .row .k { color: #999; }
    footer { border-top-color: #333; }
    button.secondary { color: #eee; border-color: #555; }
    button.secondary:hover { background: #2a2a2a; }
  }
</style>
</head>
<body>
  <header>
    <img src="../icons/icon-48.png" alt="">
    <h1>fox-webusb</h1>
  </header>

  <div id="status" class="status">確認中…</div>
  <div id="detail" class="detail"></div>

  <footer>
    <button id="openOptions">デバイス・許可の管理を開く</button>
    <button id="retry" class="secondary">再接続を試す</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
