name: Publish fox-webusb-host to PyPI

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Twine
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade twine

      - name: Check distributions
        run: |
          python -m twine check \
            dist/fox_webusb_host-0.0.0.3-py3-none-any.whl \
            dist/fox_webusb_host-0.0.0.3.tar.gz

      - name: Verify token
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "ERROR: PYPI_API_TOKEN is empty"
            exit 1
          fi

          case "$TWINE_PASSWORD" in
            pypi-*)
              echo "PyPI token detected."
              echo "Token prefix check: OK"
              ;;
            *)
              echo "ERROR: Token does not start with pypi-"
              exit 1
              ;;
          esac

      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m twine upload \
            --repository-url https://upload.pypi.org/legacy/ \
            dist/fox_webusb_host-0.0.0.3-py3-none-any.whl \
            dist/fox_webusb_host-0.0.0.3.tar.gz
