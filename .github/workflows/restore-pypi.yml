name: Restore fox-webusb-host release to PyPI

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Twine
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade twine

      - name: Check distributions
        run: |
          python -m twine check \
            dist/fox_webusb_host-0.0.0.3-py3-none-any.whl \
            dist/fox_webusb_host-0.0.0.3.tar.gz

      - name: Verify PyPI token
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$PYPI_API_TOKEN" ]; then
            echo "ERROR: PYPI_API_TOKEN is empty."
            exit 1
          fi

          case "$PYPI_API_TOKEN" in
            pypi-*)
              echo "PYPI_API_TOKEN is present."
              echo "Token format: OK"
              ;;
            *)
              echo "ERROR: Token does not start with pypi-."
              exit 1
              ;;
          esac

      - name: Upload to PyPI
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m twine upload \
            --repository-url https://upload.pypi.org/legacy/ \
            --username "__token__" \
            --password "$PYPI_API_TOKEN" \
            dist/fox_webusb_host-0.0.0.3-py3-none-any.whl \
            dist/fox_webusb_host-0.0.0.3.tar.gz
